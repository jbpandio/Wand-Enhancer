name: Sync fork from upstream

on:
  schedule:
    - cron: '0 * * * *'      # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that touch .github/workflows/.
          token: ${{ secrets.SYNC_TOKEN }}

      # The fork carries its own commits (this workflow), so master can never
      # fast-forward. Replay those commits on top of upstream instead.
      - name: Rebase master onto upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git
          git fetch upstream master
          git checkout master
          git rebase upstream/master
          git push --force-with-lease origin master
